name: Android native and debug APK build

on:
  workflow_dispatch:
  push:
    branches:
      - android/secure-credential-store
    paths:
      - "android/**"
      - "android/README.md"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: rakhsh-android-arm64
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rakhsh
        uses: actions/checkout@v4
        with:
          path: rakhsh

      - name: Check out Shabdiz sibling dependency
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/shabdiz
          ref: main
          path: shabdiz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use Android SDK preinstalled on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK platform and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Install Rust Android target and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Rakhsh Rust shared library (Android ARM64)
        working-directory: rakhsh
        run: |
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p rakhsh --lib --no-default-features

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble Android debug APK
        run: gradle -p rakhsh/android assembleDebug

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rakhsh-android-arm64-debug
          path: |
            rakhsh/android/app/build/outputs/apk/debug/app-debug.apk
            rakhsh/android/app/src/main/jniLibs/arm64-v8a/librakhsh.so
          if-no-files-found: error
